<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b29">
  <title>马尼拉 · 联机桌游</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="noise"></div>
  <main id="app">
    <section id="screen-auth" class="screen auth-screen">
      <div class="auth-illustration" aria-hidden="true">
        <div class="sun"></div>
        <div class="sail sail-one">⛵</div>
        <div class="sail sail-two">⛵</div>
        <div class="water-line"></div>
      </div>
      <div class="auth-card paper-card">
        <div class="eyebrow">THE MERCHANTS OF</div>
        <h1>马尼拉</h1>
        <p class="title-en">MANILA</p>
        <p class="lead">竞拍港务长，装载货船，在骰点与人心之间押上你的比索。</p>
        <form id="auth-form">
          <label for="nickname">你的商人名号</label>
          <input id="nickname" maxlength="16" minlength="2" autocomplete="nickname" placeholder="2–16 个字符" required>
          <button class="btn primary block" type="submit">进入马尼拉港</button>
        </form>
        <p class="fine-print">3–5 人 · 房间码联机 · 原版 2005 标准流程</p>
      </div>
    </section>

    <section id="screen-lobby" class="screen hidden">
      <header class="topbar">
        <div><span class="top-kicker">PORT AUTHORITY</span><h1>马尼拉航运局</h1></div>
        <div class="identity"><span id="lobby-me"></span><button id="logout" class="btn ghost small" type="button">更换身份</button></div>
      </header>
      <div class="lobby-grid">
        <section class="paper-card panel create-panel">
          <div class="panel-number">01</div>
          <h2>建立航运局</h2>
          <label for="room-name">房间名称</label>
          <input id="room-name" maxlength="24" placeholder="例如：周五海运商会">
          <label for="room-max">座位数量</label>
          <select id="room-max"><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option></select>
          <label for="decision-seconds">每次决策最长时间</label>
          <select id="decision-seconds"><option value="10">10 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option></select>
          <button id="create-room" class="btn primary block" type="button">创建房间</button>
          <p id="room-create-note" class="create-lock-note hidden">你已在房间中，请先退出当前房间后再创建或加入其他房间。</p>
          <div class="divider"><span>或</span></div>
          <label for="room-code">凭房间码登船</label>
          <div class="inline-form"><input id="room-code" maxlength="6" placeholder="ABC234"><button id="join-room" class="btn secondary" type="button">加入</button></div>
        </section>
        <section class="paper-card panel room-list-panel">
          <div class="panel-title-row"><div><span class="panel-number">02</span><h2>公开房间</h2></div><button id="refresh-lobby" class="btn ghost small" type="button">刷新</button></div>
          <div id="room-list" class="room-list"></div>
        </section>
        <section id="current-room" class="paper-card panel current-panel hidden"></section>
      </div>
    </section>

    <section id="screen-game" class="screen game-screen hidden">
      <header id="game-header" class="game-header"></header>
      <div id="game-root"></div>
    </section>
  </main>
  <div id="modal-root"></div>
  <div id="event-root" aria-live="assertive"></div>
  <div id="turn-alert-root" aria-live="assertive"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
