<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171723">
  <title>同桌 · TABLE CLUB</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/table-club.css">
</head>
<body>
  <div class="noise"></div>
  <main id="app">
    <section id="screen-auth" class="screen auth-screen">
      <div class="club-room-scene" aria-hidden="true">
        <span class="scene-lamp"></span><span class="scene-plant"></span><span class="scene-chair"></span>
        <span class="scene-box box-one"></span><span class="scene-box box-two"></span>
      </div>
      <article class="welcome-plaque">
        <div class="table-mark" aria-hidden="true"><i></i><b></b><i></i></div>
        <h1>同桌</h1>
        <div class="plaque-english">TABLE CLUB</div>
        <p class="welcome-line">好游戏，让我们坐到一起</p>
        <form id="auth-form" class="welcome-form">
          <label for="nickname">你的昵称</label>
          <input id="nickname" maxlength="16" minlength="2" autocomplete="nickname" placeholder="给自己取个名字" required>
          <small>2–16 个字符</small>
          <button class="seat-button" type="submit"><span>入座开局</span><i>→</i></button>
        </form>
        <div class="plaque-foot">发现桌游&nbsp;&nbsp;·&nbsp;&nbsp;创建房间&nbsp;&nbsp;·&nbsp;&nbsp;邀请好友</div>
      </article>
      <div class="table-props props-left" aria-hidden="true"><i></i><i></i><b>⚄</b></div>
      <div class="table-props props-right" aria-hidden="true"><span></span><i></i><i></i></div>
      <footer class="auth-scene-footer"><span><i></i> 服务已连接</span><span>今晚，一起玩</span></footer>
    </section>

    <section id="screen-lobby" class="screen club-lobby-screen hidden">
      <header class="club-lobby-nav">
        <div class="club-wordmark"><span class="compass-mark" aria-hidden="true">✣</span><span><b>同桌</b><small>TABLE CLUB</small></span></div>
        <div class="identity"><span id="lobby-me"></span><button id="logout" class="btn ghost small" type="button">更换身份</button></div>
      </header>
      <div class="club-lobby-layout">
        <main class="club-lobby-main">
          <div class="lobby-intro"><span>TONIGHT'S TABLE</span><h1>今晚，玩哪一局？</h1><p>选一款桌游，和朋友一起入座</p></div>
          <div class="lobby-games" aria-label="选择桌游">
            <button class="lobby-game-tray manila-tray active" data-lobby-mode="manila" type="button">
              <span class="tray-scene manila-scene" aria-hidden="true"><i class="harbor harbor-a"></i><i class="harbor harbor-b"></i><b class="mini-ship ship-one">▲</b><b class="mini-ship ship-two">▲</b><b class="mini-ship ship-three">▲</b><em>⚄</em></span>
              <span class="tray-caption"><span class="tray-icon">⛵</span><span><strong>马尼拉</strong><small>MANILA</small><em>航运 · 竞拍 · 策略</em></span><b>3–5 人</b></span>
              <span class="tray-check">✓</span>
            </button>
            <button class="lobby-game-tray splendor-tray" data-lobby-mode="splendor" type="button">
              <span class="tray-scene splendor-scene" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b><b></b><b></b></span>
              <span class="tray-caption"><span class="tray-icon">◆</span><span><strong>璀璨宝石</strong><small>SPLENDOR</small><em>宝石 · 收集 · 构筑</em></span><b>2–4 人</b></span>
              <span class="tray-check">✓</span>
            </button>
          </div>
          <section class="create-table-panel">
            <div class="create-heading"><span class="door-icon">♙</span><h2>创建房间</h2><span>已选：<b id="selected-mode-label">马尼拉</b></span></div>
            <select id="game-mode" class="visually-hidden-select" tabindex="-1"><option value="manila">马尼拉 · 航运竞逐</option><option value="splendor">璀璨宝石 · 引擎构筑</option></select>
            <div class="create-fields">
              <label for="room-name"><span>房间名称</span><input id="room-name" maxlength="24" placeholder="周五好友局"></label>
              <label for="room-max"><span>人数</span><select id="room-max"><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option></select></label>
              <label for="decision-seconds"><span>决策时间</span><select id="decision-seconds"><option value="10">10 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option></select></label>
              <button id="create-room" class="create-seat-button" type="button">创建并入座</button>
            </div>
            <p class="create-hint">ⓘ 人数不足时，可添加人机一起玩</p>
            <p id="room-create-note" class="create-lock-note hidden">你已在房间中，请先退出当前房间后再创建或加入其他房间。</p>
          </section>
        </main>
        <aside class="club-room-board">
          <div class="room-board-head"><div><h2>公开房间</h2><p>选择房间，与朋友同桌</p></div><button id="refresh-lobby" class="round-refresh" type="button" aria-label="刷新房间">↻</button></div>
          <div id="room-list" class="room-list"></div>
          <div class="code-join"><h3><span>♟</span> 房间码加入</h3><div class="inline-form"><input id="room-code" maxlength="6" placeholder="输入 6 位房间码"><button id="join-room" type="button">加入</button></div></div>
        </aside>
        <section id="current-room" class="current-table-panel hidden"></section>
      </div>
      <footer class="lobby-scene-footer"><span><i></i> 服务已连接</span><span>好游戏，好朋友</span></footer>
    </section>

    <section id="screen-game" class="screen game-screen hidden">
      <header id="game-header" class="game-header"></header>
      <div id="game-root"></div>
    </section>
  </main>
  <div id="modal-root"></div>
  <div id="event-root" aria-live="assertive"></div>
  <div id="turn-alert-root" aria-live="assertive"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/splendor-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
