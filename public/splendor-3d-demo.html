<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>璀璨宝石 · 入座视角 Demo</title>
<link rel="stylesheet" href="css/splendor-3d-demo.css">
</head>
<body>
<main id="demo-shell">
  <div id="scene" aria-label="璀璨宝石三维桌面"></div>
  <header class="demo-header">
    <a href="/">← 返回大厅</a>
    <div class="brand"><h1>璀璨宝石</h1><span>S P L E N D O R</span></div>
    <div class="demo-controls"><label>体验座位 <select id="seat-select" aria-label="切换体验座位"></select></label><button id="reset-camera" type="button">归位</button></div>
  </header>
  <section id="opponents" class="player-strip" aria-label="其他玩家"></section>
  <section id="self-accessible" class="sr-only" aria-label="我的珠宝行"></section>
  <aside class="turn-panel"><span id="turn-copy"></span><button id="confirm-demo" type="button">体验拿取</button><small id="selection-copy" role="status" aria-live="polite">点选一组宝石，体验拿取动画</small></aside>
  <footer class="demo-note"><span>同桌 · 视觉体验 Demo</span><span>拖动微调视角 · 点击宝石或卡牌</span></footer>
  <div id="loading" role="status"><p>正在为你布置桌面…</p></div>
</main>
<script type="module">
  import('./js/splendor-3d-demo.js').catch(error => {
    console.error(error);
    document.querySelector('#loading p').textContent = '三维桌面暂时无法加载，请启用浏览器硬件加速后刷新。';
  });
</script>
</body>
</html>
